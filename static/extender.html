<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Extender Node</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--surface:#0f1424;--teal:#1D9E75;--text:#e0e6f0;--muted:#6b7a99;
  --border:rgba(255,255,255,0.06);--glass:rgba(255,255,255,0.03);--font:'JetBrains Mono',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--font);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px}
.card{background:var(--glass);border:1px solid rgba(255,255,255,0.08);border-radius:20px;
  padding:32px;width:100%;max-width:360px;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08)}
.title{font-size:0.8rem;font-weight:700;letter-spacing:0.12em;color:var(--teal);
  margin-bottom:4px;text-transform:uppercase}
.subtitle{font-size:0.65rem;color:var(--muted);margin-bottom:24px}
/* Gauge */
.gauge-svg{width:180px;height:180px;margin:0 auto 20px}
.gauge-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:10}
.gauge-fill{fill:none;stroke:var(--teal);stroke-width:10;stroke-linecap:round;
  transition:stroke-dashoffset 0.5s cubic-bezier(0.16,1,0.3,1)}
.gauge-text{font-family:var(--font);font-size:32px;font-weight:700;fill:var(--text);text-anchor:middle}
.gauge-label{font-family:var(--font);font-size:10px;fill:var(--muted);text-anchor:middle}
/* Metrics */
.metrics{display:flex;justify-content:space-around;margin-bottom:20px;font-size:0.72rem}
.metric{text-align:center}
.metric .val{font-weight:600;font-size:0.85rem;color:var(--text)}
.metric .lbl{color:var(--muted);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.05em}
/* Status */
.status-badge{display:inline-block;padding:4px 16px;border-radius:20px;font-size:0.7rem;
  font-weight:700;letter-spacing:0.1em;margin-bottom:16px}
.status-badge.sending{background:rgba(29,158,117,0.12);color:var(--teal);border:1px solid rgba(29,158,117,0.25)}
.status-badge.error{background:rgba(255,68,68,0.12);color:#ff4444;border:1px solid rgba(255,68,68,0.25)}
.status-badge.idle{background:rgba(107,122,153,0.12);color:var(--muted);border:1px solid rgba(107,122,153,0.2)}
/* Server input */
.server-input{width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-family:var(--font);font-size:0.72rem;padding:8px 12px;
  border-radius:10px;text-align:center;margin-bottom:12px}
.server-input:focus{outline:none;border-color:rgba(29,158,117,0.4)}
/* Log */
.log{margin-top:16px;max-height:120px;overflow-y:auto;font-size:0.6rem;color:var(--muted);
  text-align:left;border-top:1px solid var(--border);padding-top:8px}
.log::-webkit-scrollbar{width:3px}
.log::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.log div{padding:1px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.note{font-size:0.6rem;color:var(--muted);margin-top:16px;line-height:1.6}
</style>
</head>
<body>

<div class="card">
  <div class="title">Extender Node</div>
  <div class="subtitle">WiFi signal proxy via RTT — posts to laptop server</div>

  <svg class="gauge-svg" viewBox="0 0 180 180">
    <circle class="gauge-bg" cx="90" cy="90" r="74"/>
    <circle class="gauge-fill" id="gaugeFill" cx="90" cy="90" r="74"
            stroke-dasharray="465" stroke-dashoffset="465" transform="rotate(-90 90 90)"/>
    <text class="gauge-text" x="90" y="88" id="gaugeText">—</text>
    <text class="gauge-label" x="90" y="110">SIGNAL %</text>
  </svg>

  <div class="status-badge idle" id="statusBadge">IDLE</div>

  <div class="metrics">
    <div class="metric"><div class="val" id="rttVal">—</div><div class="lbl">RTT ms</div></div>
    <div class="metric"><div class="val" id="sigVal">—</div><div class="lbl">Signal</div></div>
    <div class="metric"><div class="val" id="postCount">0</div><div class="lbl">Posts</div></div>
  </div>

  <input class="server-input" id="serverUrl" value="http://192.168.1.5:5000"
         placeholder="http://laptop-ip:5000"/>

  <div class="note">
    Open this page on a device connected to the WiFi extender.<br>
    Set the URL to your laptop's local IP. The page will auto-POST signal data every second.
  </div>

  <div class="log" id="log"></div>
</div>

<script>
const CIRC = 2 * Math.PI * 74;
const gaugeFill = document.getElementById('gaugeFill');
const gaugeText = document.getElementById('gaugeText');
const statusBadge = document.getElementById('statusBadge');
const rttVal = document.getElementById('rttVal');
const sigVal = document.getElementById('sigVal');
const postCount = document.getElementById('postCount');
const serverUrl = document.getElementById('serverUrl');
const logEl = document.getElementById('log');

let posts = 0;

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = `[${new Date().toTimeString().slice(0,8)}] ${msg}`;
  logEl.insertBefore(d, logEl.firstChild);
  while (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
}

function updateGauge(pct) {
  const offset = CIRC - (CIRC * Math.min(pct, 100) / 100);
  gaugeFill.style.strokeDashoffset = offset;
  gaugeText.textContent = `${Math.round(pct)}%`;
}

async function measureAndSend() {
  const base = serverUrl.value.replace(/\/+$/, '');

  // Measure RTT to server as signal proxy
  const t0 = performance.now();
  let rtt = 999;
  let signal = 0;

  try {
    // Ping the fused endpoint to measure latency
    await fetch(`${base}/fused`, { method: 'GET', mode: 'cors', cache: 'no-cache' });
    rtt = Math.round(performance.now() - t0);

    // Convert RTT to signal percentage
    // Lower RTT = better signal. Typical LAN: 1-20ms. WiFi: 5-100ms
    if (rtt <= 5) signal = 98;
    else if (rtt <= 10) signal = 90;
    else if (rtt <= 20) signal = 80;
    else if (rtt <= 40) signal = 70;
    else if (rtt <= 80) signal = 55;
    else if (rtt <= 150) signal = 40;
    else if (rtt <= 300) signal = 25;
    else signal = 10;

    // Add jitter for more natural readings
    signal = Math.max(1, Math.min(100, signal + Math.round((Math.random() - 0.5) * 6)));

    rttVal.textContent = rtt;
    sigVal.textContent = signal;
    updateGauge(signal);

    // POST to extender endpoint
    const resp = await fetch(`${base}/extender`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ signal, rtt })
    });

    if (resp.ok) {
      posts++;
      postCount.textContent = posts;
      statusBadge.textContent = 'SENDING';
      statusBadge.className = 'status-badge sending';
      addLog(`POST signal=${signal} rtt=${rtt}ms → OK`);
    } else {
      statusBadge.textContent = 'ERROR';
      statusBadge.className = 'status-badge error';
      addLog(`POST failed: HTTP ${resp.status}`);
    }
  } catch (e) {
    rttVal.textContent = '—';
    sigVal.textContent = '—';
    statusBadge.textContent = 'ERROR';
    statusBadge.className = 'status-badge error';
    addLog(`Error: ${e.message}`);
  }
}

setInterval(measureAndSend, 1000);
addLog('Extender node started');
</script>
</body>
</html>
