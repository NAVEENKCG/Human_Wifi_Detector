<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Sensing Radar POV</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050A18;
  --surface:#0D1526;
  --text:#FAFAF8;
  --muted:#8b9bb4;
  --border:rgba(255,255,255,0.08);
  --glass:rgba(255,255,255,0.03);
  --idle:#38A169;
  --watching:#D97706;
  --activity:#E8912A;
  --motion:#E53E3E;
  --laptop:#378ADD;
  --phone:#BA7517;
  --extender:#1D9E75;
  --font:'JetBrains Mono',monospace;
}
html{font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;overflow:hidden;}

/* ── LAYOUT ── */
#radar-col{flex:1; position:relative; background:radial-gradient(circle at center, #0B132B 0%, #050A18 100%);}
#panel-col{width:420px; height:100vh; background:rgba(13,21,38,0.8); border-left:1px solid var(--border); padding:20px; display:flex; flex-direction:column; gap:16px; overflow-y:auto;}

@media(max-width:800px){
  body{flex-direction:column; overflow-y:auto;}
  #radar-col{width:100%; height:50vh;}
  #panel-col{width:100%; height:auto; padding-bottom:80px;}
}

/* ── RADAR CANVAS ── */
#radarCanvas{width:100%; height:100%; display:block;}
.radar-overlay{position:absolute; top:24px; left:24px; right:24px; display:flex; justify-content:space-between; pointer-events:none;}
.hud-title{font-size:1.2rem; font-weight:800; letter-spacing:0.05em; display:flex; align-items:center; gap:8px;}
.hud-sub{font-size:0.7rem; color:var(--muted); letter-spacing:0.15em; margin-top:4px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--laptop); box-shadow:0 0 10px var(--laptop);}

.state-pill{padding:8px 16px; border-radius:24px; font-weight:800; font-size:0.85rem; letter-spacing:0.1em; border:1px solid var(--border); background:rgba(0,0,0,0.5); display:flex; align-items:center; gap:8px;}
.blink-dot{width:8px; height:8px; border-radius:50%; animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

.radar-legend{position:absolute; bottom:24px; left:24px; display:flex; gap:16px; font-size:0.65rem; color:var(--muted); pointer-events:none; background:rgba(0,0,0,0.5); padding:10px 16px; border-radius:12px; border:1px solid var(--border);}
.leg-item{display:flex; align-items:center; gap:6px;}
.leg-color{width:10px; height:10px; border-radius:50%;}

/* ── PANELS ── */
.panel{background:var(--glass); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:20px;}
.panel-title{font-size:0.65rem; font-weight:700; color:var(--muted); letter-spacing:0.1em; margin-bottom:16px;}

.status-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.metric-box{border-bottom:1px solid var(--border); padding-bottom:12px;}
.metric-lbl{font-size:0.6rem; color:var(--muted); letter-spacing:0.1em; margin-bottom:4px;}
.metric-val{font-size:2rem; font-weight:800; line-height:1;}
.metric-val span{font-size:0.8rem; color:var(--muted); font-weight:500; margin-left:4px;}

.node-list{display:flex; flex-direction:column; gap:12px;}
.node-card{background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:12px; display:flex; justify-content:space-between; align-items:center; transition:0.3s;}
.nc-left{display:flex; flex-direction:column; gap:4px;}
.nc-name{font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em;}
.nc-z{font-size:0.6rem; color:var(--muted);}
.nc-right{text-align:right;}
.nc-sig{font-size:1.4rem; font-weight:800; line-height:1;}
.nc-sig small{font-size:0.6rem; color:var(--muted); font-weight:500;}

.chart-wrap{height:160px; position:relative; width:100%;}
.controls{display:flex; justify-content:space-between; align-items:center; margin-top:auto;}
.btn{background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:8px; font-family:var(--font); font-size:0.65rem; font-weight:700; cursor:pointer; transition:0.2s;}
.btn:hover{background:rgba(255,255,255,0.1);}
.btn.active{background:var(--idle); color:#000; border-color:var(--idle);}

#offlineBanner{position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(229,62,62,0.2); border:1px solid rgba(229,62,62,0.4); color:#ff8888; padding:8px 24px; border-radius:12px; font-size:0.75rem; font-weight:700; z-index:50; display:none; backdrop-filter:blur(8px);}
#offlineBanner.visible{display:block;}
</style>
</head>
<body>

<div id="offlineBanner">⚠ SERVER UNREACHABLE</div>

<!-- RADAR COLUMN -->
<div id="radar-col">
  <canvas id="radarCanvas"></canvas>
  
  <div class="radar-overlay">
    <div>
      <div class="hud-title"><div class="dot"></div> <span style="color:var(--laptop)">LAPTOP</span> POV SENSOR</div>
      <div class="hud-sub">SWEEP RADIUS: 5.0 METERS</div>
    </div>
    <div>
      <div class="state-pill" id="hudState">
        <div class="blink-dot" id="hudDot" style="background:var(--idle)"></div>
        <span id="hudTxt" style="color:var(--idle)">IDLE</span>
      </div>
    </div>
  </div>

  <div class="radar-legend">
    <div class="leg-item"><div class="leg-color" style="background:var(--laptop)"></div> LAPTOP (ORIGIN)</div>
    <div class="leg-item"><div class="leg-color" style="background:var(--phone)"></div> PHONE NODE</div>
    <div class="leg-item"><div class="leg-color" style="background:var(--motion); box-shadow:0 0 8px var(--motion)"></div> PERSON (MOTION)</div>
  </div>
</div>

<!-- PANELS COLUMN -->
<div id="panel-col">
  
  <div class="panel">
    <div class="panel-title">SENSING METRICS</div>
    <div class="status-grid">
      <div class="metric-box">
        <div class="metric-lbl">CONFIDENCE</div>
        <div class="metric-val" id="val-conf">0<span>%</span></div>
      </div>
      <div class="metric-box">
        <div class="metric-lbl">MAX VARIANCE</div>
        <div class="metric-val" id="val-var">0.00<span>v</span></div>
      </div>
    </div>
  </div>

  <div class="panel" style="padding:16px;">
    <div class="panel-title" style="margin-bottom:12px;">ACTIVE NODES</div>
    <div class="node-list">
      <div class="node-card" id="card-laptop" style="border-left:3px solid var(--laptop)">
        <div class="nc-left">
          <div class="nc-name" style="color:var(--laptop)">LAPTOP</div>
          <div class="nc-z" id="z-laptop">Var: 0.00</div>
        </div>
        <div class="nc-right">
          <div class="nc-sig" id="sig-laptop">--<small>dBm</small></div>
        </div>
      </div>
      <div class="node-card" id="card-phone" style="border-left:3px solid var(--phone)">
        <div class="nc-left">
          <div class="nc-name" style="color:var(--phone)">PHONE</div>
          <div class="nc-z" id="z-phone">Var: 0.00</div>
        </div>
        <div class="nc-right">
          <div class="nc-sig" id="sig-phone">--<small>dBm</small></div>
        </div>
      </div>
      <div class="node-card" id="card-extender" style="border-left:3px solid var(--extender)">
        <div class="nc-left">
          <div class="nc-name" style="color:var(--extender)">EXTENDER</div>
          <div class="nc-z" id="z-extender">Var: 0.00</div>
        </div>
        <div class="nc-right">
          <div class="nc-sig" id="sig-extender">--<small>dBm</small></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">SIGNAL TRACE</div>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  </div>

  <div class="controls">
    <button class="btn" id="btnSim">SIMULATOR: OFF</button>
    <button class="btn" id="btnMute">SOUND ON</button>
  </div>

</div>

<script>
const $=id=>document.getElementById(id);
const KEYS = ['laptop','phone','extender'];
const COLS = {laptop:0x378ADD, phone:0xBA7517, extender:0x1D9E75};
const SCOLS = {CALIBRATING:'#888',IDLE:'#38A169',WATCHING:'#D97706',ACTIVITY:'#E8912A',MOTION:'#E53E3E',CONFIRMED:'#ff2020'};

let sysState={state:'CALIBRATING',conf:0,nodes:{},pos:{}};
let history={laptop:[],phone:[],extender:[]};
let muted=false, simMode=false;

// Audio
let actx=null;
function beep(f,d=80){
  if(muted)return;
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  try{const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=f;g.gain.value=0.05;
    o.connect(g);g.connect(actx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d/1000);
    o.stop(actx.currentTime+d/1000+0.05)}catch(e){}
}

// ── RADAR LOGIC ──
const canvas = $('radarCanvas');
const ctx = canvas.getContext('2d');
let w, h, cx, cy, radius, scale;
let sweepAng = 0;
let blips = []; 

function resize(){
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  w = canvas.width; h = canvas.height;
  cx = w / 2; cy = h / 2;
  radius = Math.min(cx, cy) * 0.8;
  scale = radius / 5.0; 
}
window.addEventListener('resize', resize);
resize();

function checkSweep(oldAng, newAng, targetAng) {
  if (oldAng <= targetAng && targetAng <= newAng) return true;
  if (oldAng > newAng && (targetAng >= oldAng || targetAng <= newAng)) return true;
  return false;
}

function renderRadar(){
  requestAnimationFrame(renderRadar);
  ctx.clearRect(0,0,w,h);

  // Background Rings
  ctx.strokeStyle = 'rgba(56, 161, 105, 0.2)';
  ctx.lineWidth = 2 * window.devicePixelRatio;
  for(let i=1; i<=4; i++){
    ctx.beginPath();
    ctx.arc(cx, cy, radius * (i/4), 0, Math.PI*2);
    ctx.stroke();
  }
  
  // Crosshairs
  ctx.beginPath();
  ctx.moveTo(cx, cy - radius - 20); ctx.lineTo(cx, cy + radius + 20);
  ctx.moveTo(cx - radius - 20, cy); ctx.lineTo(cx + radius + 20, cy);
  ctx.stroke();

  // Draw Sweep Beam
  let sweepSpeed = 0.035;
  let oldAng = sweepAng;
  sweepAng += sweepSpeed;
  if(sweepAng > Math.PI*2) sweepAng -= Math.PI*2;
  
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(sweepAng);
  for(let a=0; a<40; a++){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0, radius, -a*0.015, -(a+1)*0.015, true);
    ctx.fillStyle = `rgba(56,161,105, ${0.4 - a/100})`;
    ctx.fill();
  }
  ctx.restore();

  // Detect and inject blips
  const p = sysState.pos;
  if (p && p.laptop && p.phone) {
    let lx = p.laptop.x, lz = p.laptop.z;
    
    // Phone Node
    let px = p.phone.x, pz = p.phone.z;
    let phdx = px - lx, phdz = pz - lz;
    let phAng = Math.atan2(phdz, phdx);
    if(phAng < 0) phAng += Math.PI*2;
    if(checkSweep(oldAng, sweepAng, phAng)) {
      blips.push({x: phdx, y: phdz, life: 1.0, type: 'phone'});
    }

    // Person
    if (sysState.conf > 0.3) {
      let mdx = (px - lx)/2 + (Math.random()-0.5)*0.5;
      let mdz = (pz - lz)/2 + (Math.random()-0.5)*0.5;
      let mAng = Math.atan2(mdz, mdx);
      if(mAng < 0) mAng += Math.PI*2;
      if(checkSweep(oldAng, sweepAng, mAng)) {
        blips.push({x: mdx, y: mdz, life: 1.0, type: 'person'});
      }
    }
  }

  // Draw Blips
  for(let i=blips.length-1; i>=0; i--){
    let b = blips[i];
    b.life -= 0.008; // fade rate
    if(b.life <= 0){ blips.splice(i,1); continue; }
    
    let bx = cx + b.x * scale;
    let by = cy + b.y * scale; 
    let color = b.type==='person' ? '229,62,62' : '186,117,23';
    
    ctx.beginPath();
    ctx.arc(bx, by, b.type==='person' ? 6*window.devicePixelRatio : 4*window.devicePixelRatio, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${color}, ${b.life})`;
    ctx.shadowBlur = 15;
    ctx.shadowColor = `rgba(${color}, 1)`;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Draw Laptop (Center Origin)
  ctx.beginPath();
  ctx.arc(cx, cy, 6*window.devicePixelRatio, 0, Math.PI*2);
  ctx.fillStyle = '#378ADD';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#378ADD';
  ctx.fill();
  ctx.shadowBlur = 0;
}
requestAnimationFrame(renderRadar);

// ── CHARTS ──
const mCtx=$('mainChart').getContext('2d');
const mainChart=new Chart(mCtx,{
  type:'line',
  data:{labels:Array(60).fill(''),datasets:[
    {borderColor:'#378ADD',borderWidth:2,pointRadius:0,tension:0.3,data:Array(60).fill(null)},
    {borderColor:'#BA7517',borderWidth:2,pointRadius:0,tension:0.3,data:Array(60).fill(null)},
    {borderColor:'#1D9E75',borderWidth:2,pointRadius:0,tension:0.3,data:Array(60).fill(null)}
  ]},
  options:{responsive:true,maintainAspectRatio:false,animation:false,
    scales:{x:{display:false},y:{display:false, min:0,max:100}},
    plugins:{legend:{display:false}}
  }
});

// ── UPDATE LOGIC ──
function processData(d){
  sysState.state=d.state||'IDLE';
  sysState.conf=d.confidence||0;
  sysState.nodes=d.nodes||{};
  sysState.pos=d.positions||{};

  const c = SCOLS[sysState.state] || '#888';
  $('hudState').style.borderColor = c;
  $('hudDot').style.background = c;
  $('hudTxt').style.color = c;
  $('hudTxt').textContent = sysState.state;

  $('val-conf').innerHTML = `${Math.round(sysState.conf*100)}<span>%</span>`;
  
  let maxVar = 0;
  KEYS.forEach((k,i)=>{
    const n = sysState.nodes[k] || {};
    const card = $(`card-${k}`);
    if(n.motion) card.style.borderColor = 'var(--motion)';
    else card.style.borderColor = 'rgba(255,255,255,0.08)';

    $(`sig-${k}`).innerHTML = `${Math.round((n.signal||0)/2 - 100)}<small>dBm</small>`;
    
    let z = n.zscore || 0;
    $(`z-${k}`).textContent = `Var: ${z.toFixed(2)}`;
    if(z > 2.0) $(`z-${k}`).style.color = 'var(--motion)';
    else if(z > 1.5) $(`z-${k}`).style.color = 'var(--activity)';
    else $(`z-${k}`).style.color = 'var(--muted)';
    
    if(Math.abs(z) > maxVar) maxVar = Math.abs(z);

    history[k].push(n.smoothed||n.signal||0);
    if(history[k].length>60)history[k].shift();
    mainChart.data.datasets[i].data=history[k];
  });
  mainChart.update();
  $('val-var').innerHTML = `${maxVar.toFixed(2)}<span>v</span>`;
}

// ── POLLING / SIM ──
async function poll(){
  if(simMode){runSim();return;}
  try{
    const r=await fetch('/fused');
    if(!r.ok)throw new Error();
    processData(await r.json());
    $('offlineBanner').classList.remove('visible');
  }catch(e){
    $('offlineBanner').classList.add('visible');
  }
}

let simT=0;
function runSim(){
  simT++;
  let isBurst = (simT%15>0 && simT%15<6);
  let ld = 78 + Math.sin(simT)*2 + (Math.random()*2-1) - (isBurst?14:0);
  let pd = 65 + Math.cos(simT)*2 + (Math.random()*2-1) - (isBurst?14:0);
  let conf = isBurst?0.85:0;
  
  processData({
    state: isBurst?'MOTION':'IDLE',
    confidence: conf,
    nodes: {
      extender:{signal:71,smoothed:71,zscore:0.2,motion:false,online:true,calibrated:true},
      laptop:{signal:Math.round(ld),smoothed:ld,zscore:isBurst?2.8:0.5,motion:isBurst,online:true,calibrated:true},
      phone:{signal:Math.round(pd),smoothed:pd,zscore:isBurst?2.3:0.1,motion:isBurst,online:true,calibrated:true}
    },
    positions: {
      extender:{x:0,y:0,z:0},
      laptop:{x:2.1,y:0,z:0.2},
      phone:{x:-1.8,y:0,z:0.05}
    }
  });
}

$('btnSim').onclick=e=>{
  simMode=!simMode;
  e.target.textContent = simMode ? 'SIMULATOR: ON' : 'SIMULATOR: OFF';
  e.target.classList.toggle('active', simMode);
};
$('btnMute').onclick=e=>{
  muted=!muted;
  e.target.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
};

setInterval(poll,1000);
poll();
</script>
</body>
</html>
