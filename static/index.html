<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI Sensing — NAVEENKCG</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --panel: #111827;
            --border: #1e293b;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --alert: #ff4444;
            --alert-glow: rgba(255, 68, 68, 0.3);
            --amber: #f59e0b;
            --green: #22c55e;
            --text: #e2e8f0;
            --text-dim: #64748b;
            --mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Offline Banner ── */
        .offline-banner {
            background: var(--alert);
            color: #fff;
            text-align: center;
            padding: 0.5rem;
            font-weight: 700;
            font-size: 0.85rem;
            display: none;
            letter-spacing: 1px;
        }

        /* ── Top Bar ── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.5rem;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .topbar-brand {
            color: var(--accent);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .topbar-center {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            transition: all 0.3s;
        }
        .dot.off {
            background: var(--alert);
            box-shadow: 0 0 6px var(--alert);
        }
        .topbar-right {
            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
        }
        .slider-group {
            display: flex; align-items: center; gap: 6px; font-size: 0.8rem;
        }
        .slider-group input[type=range] {
            accent-color: var(--accent); cursor: pointer; width: 100px;
        }
        .btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.35rem 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--mono);
            font-size: 0.75rem;
            transition: all 0.3s;
        }
        .btn:hover { background: rgba(0,212,255,0.1); }
        .btn:active { transform: scale(0.96); }

        /* ── Dashboard Grid ── */
        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
            min-height: 0;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-title {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* ── Column 1: Vitals ── */
        .vitals { align-items: center; }
        .ssid-tag {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        /* Gauge */
        .gauge-wrap {
            position: relative;
            width: 160px; height: 160px;
            margin-bottom: 0.75rem;
        }
        .gauge-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .gauge-track { fill: none; stroke: var(--border); stroke-width: 10; }
        .gauge-bar {
            fill: none; stroke: var(--green); stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 408; /* 2πr, r=65 */
            stroke-dashoffset: 408;
            transition: stroke-dashoffset 0.5s ease, stroke 0.5s ease;
        }
        .gauge-label {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .gauge-label .big { font-size: 28px; font-weight: 700; }
        .gauge-label .sub { font-size: 0.7rem; color: var(--text-dim); }

        /* Mini gauges */
        .mini-gauges {
            display: flex; gap: 1rem;
            margin: 0.75rem 0;
        }
        .mini-gauge-wrap {
            position: relative;
            width: 90px; height: 90px;
        }
        .mini-gauge-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .mini-track { fill: none; stroke: var(--border); stroke-width: 6; }
        .mini-bar {
            fill: none; stroke: var(--accent); stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 220; /* 2πr, r=35 */
            stroke-dashoffset: 220;
            transition: stroke-dashoffset 0.5s ease, stroke 0.5s ease;
        }
        .mini-label {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .mini-label .val { font-size: 16px; font-weight: 700; }
        .mini-label .tag { font-size: 0.55rem; color: var(--text-dim); }

        .calibrating-spinner {
            color: var(--text-dim);
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Status Badge */
        .badge {
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            margin-top: auto;
            transition: all 0.3s;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .badge.motion {
            background: rgba(255,68,68,0.15);
            border-color: var(--alert);
            color: var(--alert);
            animation: pulse-badge 1s infinite;
        }
        .badge.vital {
            background: rgba(0,212,255,0.1);
            border-color: var(--accent);
            color: var(--accent);
            animation: pulse-badge 1.5s infinite;
        }
        @keyframes pulse-badge {
            0% { box-shadow: 0 0 0 0 rgba(255,68,68,0.5); }
            70% { box-shadow: 0 0 0 8px rgba(255,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,68,68,0); }
        }

        /* ── Column 2: Charts ── */
        .charts-col { gap: 1rem; }
        .chart-box {
            position: relative;
            height: 200px;
            transition: background 0.3s;
        }
        .chart-box.flash { background: rgba(255,68,68,0.12); }

        /* CSI Heatmap */
        .heatmap-section { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .heatmap-title {
            font-size: 0.7rem; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .heatmap-canvas-wrap {
            flex: 1; position: relative; min-height: 120px;
        }
        #csi-heatmap {
            width: 100%; height: 100%;
            border-radius: 4px;
            image-rendering: pixelated;
        }

        /* Mini Stats */
        .stat-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .stat-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem;
            text-align: center;
        }
        .stat-card .lbl { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; }
        .stat-card .val { font-size: 1rem; font-weight: 700; margin-top: 0.25rem; }

        /* ── Column 3: Log + Controls ── */
        .log-col { gap: 0.75rem; }
        .control-group {
            display: flex; flex-direction: column; gap: 0.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        .control-row {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 0.8rem;
        }
        .sim-toggle {
            display: flex; align-items: center; gap: 8px;
        }
        .sim-toggle input[type=checkbox] {
            accent-color: var(--accent); cursor: pointer;
            width: 16px; height: 16px;
        }
        .sim-badge {
            background: var(--accent);
            color: var(--bg);
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            display: none;
        }
        .sim-badge.active { display: inline; }

        .log-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.75rem;
            min-height: 0;
        }
        .log-entry {
            padding: 4px 8px;
            border-left: 2px solid var(--accent);
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .log-entry.alert {
            border-color: var(--alert);
            color: var(--alert);
        }
        .log-entry.breath {
            border-color: var(--accent);
            color: var(--accent);
        }

        .log-actions {
            display: flex; gap: 0.5rem;
        }
        .log-actions .btn { flex: 1; text-align: center; }

        /* HW Status card */
        .hw-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: auto;
        }
        .hw-card .mode {
            color: var(--accent);
            font-weight: 700;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* Responsive */
        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .topbar { justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

<div id="offline-banner" class="offline-banner">⚠ SERVER OFFLINE — RECONNECTING…</div>

<nav class="topbar">
    <div class="topbar-brand">[ HUMAN WIFI DETECTOR v2 ]</div>
    <div class="topbar-center">
        <div id="conn-dot" class="dot"></div>
        <span id="ssid-top">Scanning…</span>
    </div>
    <div class="topbar-right">
        <div class="slider-group">
            <span id="sens-label">SENSITIVITY: 2.0σ</span>
            <input type="range" id="thresh-slider" min="1.0" max="4.0" step="0.1" value="2.0">
        </div>
        <button id="btn-mute" class="btn">🔔 BEEP ON</button>
    </div>
</nav>

<main class="dashboard">
    <!-- ── Col 1: Vitals ── -->
    <section class="panel vitals">
        <div class="panel-title">Vitals</div>
        <div id="ssid-display" class="ssid-tag">---</div>

        <!-- Main gauge -->
        <div class="gauge-wrap">
            <svg class="gauge-svg" viewBox="0 0 160 160">
                <circle class="gauge-track" cx="80" cy="80" r="65"></circle>
                <circle id="main-bar" class="gauge-bar" cx="80" cy="80" r="65"></circle>
            </svg>
            <div class="gauge-label">
                <div class="big"><span id="sig-val">0</span>%</div>
                <div class="sub">SIGNAL</div>
            </div>
        </div>

        <!-- Mini gauges: Breathing + Heart -->
        <div class="mini-gauges">
            <div class="mini-gauge-wrap">
                <svg class="mini-gauge-svg" viewBox="0 0 90 90">
                    <circle class="mini-track" cx="45" cy="45" r="35"></circle>
                    <circle id="breath-bar" class="mini-bar" cx="45" cy="45" r="35"></circle>
                </svg>
                <div class="mini-label">
                    <div id="breath-val" class="val calibrating-spinner">--</div>
                    <div class="tag">BPM</div>
                </div>
            </div>
            <div class="mini-gauge-wrap">
                <svg class="mini-gauge-svg" viewBox="0 0 90 90">
                    <circle class="mini-track" cx="45" cy="45" r="35"></circle>
                    <circle id="hr-bar" class="mini-bar" cx="45" cy="45" r="35" style="stroke: var(--alert)"></circle>
                </svg>
                <div class="mini-label">
                    <div id="hr-val" class="val calibrating-spinner">--</div>
                    <div class="tag">HR</div>
                </div>
            </div>
        </div>

        <div id="status-badge" class="badge">● IDLE</div>
    </section>

    <!-- ── Col 2: Charts ── -->
    <section class="panel charts-col">
        <div class="panel-title">Signal Visualization</div>

        <div id="chart-box" class="chart-box">
            <canvas id="rssi-chart"></canvas>
        </div>

        <div class="heatmap-section">
            <div class="heatmap-title">Subcarrier Amplitude Map <span id="sim-indicator" class="sim-badge">[SIM]</span></div>
            <div class="heatmap-canvas-wrap">
                <canvas id="csi-heatmap"></canvas>
            </div>
        </div>

        <div class="stat-row">
            <div class="stat-card">
                <div class="lbl">Current</div>
                <div id="s-current" class="val">0%</div>
            </div>
            <div class="stat-card">
                <div class="lbl">Z-Score</div>
                <div id="s-zscore" class="val">0.00</div>
            </div>
            <div class="stat-card">
                <div class="lbl">Motion Pwr</div>
                <div id="s-motpwr" class="val">0.00</div>
            </div>
            <div class="stat-card">
                <div class="lbl">Breath BPM</div>
                <div id="s-bpm" class="val">--</div>
            </div>
        </div>
    </section>

    <!-- ── Col 3: Log + Controls ── -->
    <aside class="panel log-col">
        <div class="panel-title">Controls & Log</div>

        <div class="control-group">
            <div class="control-row">
                <span>Z-Threshold</span>
                <span id="ctrl-thresh-val">2.0σ</span>
            </div>
            <input type="range" id="ctrl-thresh" min="1.0" max="4.0" step="0.1" value="2.0"
                   style="accent-color: var(--accent); width: 100%; cursor: pointer;">
            <div class="sim-toggle">
                <input type="checkbox" id="sim-check">
                <label for="sim-check">Simulation Mode</label>
            </div>
        </div>

        <div class="log-box" id="log-box"></div>

        <div class="log-actions">
            <button id="btn-clear" class="btn">CLEAR</button>
            <button id="btn-export" class="btn">EXPORT CSV</button>
        </div>

        <div class="hw-card" id="hw-card">
            <span class="mode" id="hw-mode">RSSI Mode</span><br>
            <span>Laptop Wi-Fi</span>
        </div>
    </aside>
</main>

<script>
// ────────────────────────────────────────────────────
// Audio
// ────────────────────────────────────────────────────
let audioCtx;
let beepOn = localStorage.getItem('beep') !== 'false';
const btnMute = document.getElementById('btn-mute');

function syncMuteBtn() {
    btnMute.innerText = beepOn ? '🔔 BEEP ON' : '🔕 MUTE';
}
syncMuteBtn();

btnMute.addEventListener('click', () => {
    beepOn = !beepOn;
    localStorage.setItem('beep', beepOn);
    syncMuteBtn();
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
});

function playBeep() {
    if (!beepOn) return;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

// ────────────────────────────────────────────────────
// Chart.js — RSSI
// ────────────────────────────────────────────────────
const MAX_PTS = 60;
const chartData = Array(MAX_PTS).fill(null);
let adaptMean = null;

const rssiChart = new Chart(document.getElementById('rssi-chart').getContext('2d'), {
    type: 'line',
    data: {
        labels: Array(MAX_PTS).fill(''),
        datasets: [{
            label: 'RSSI %',
            data: chartData,
            borderColor: '#00d4ff',
            borderWidth: 2,
            tension: 0.3,
            pointRadius: 0,
            fill: false
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 0 },
        scales: {
            x: { display: false },
            y: {
                min: 0, max: 100,
                grid: { color: '#1e293b' },
                ticks: { color: '#64748b', font: { size: 10 } }
            }
        },
        plugins: { legend: { display: false } }
    },
    plugins: [{
        id: 'meanLine',
        beforeDraw: (chart) => {
            if (adaptMean === null) return;
            const { ctx: c, chartArea: { left, right }, scales: { y } } = chart;
            const yp = y.getPixelForValue(adaptMean);
            c.save();
            c.beginPath();
            c.moveTo(left, yp); c.lineTo(right, yp);
            c.lineWidth = 1; c.strokeStyle = '#64748b'; c.setLineDash([5, 5]);
            c.stroke(); c.restore();
        }
    }]
});

// ────────────────────────────────────────────────────
// CSI Heatmap
// ────────────────────────────────────────────────────
const SUBS = 56, TIME_COLS = 30;
let heatmapGrid = [];
for (let r = 0; r < SUBS; r++) {
    heatmapGrid.push(new Array(TIME_COLS).fill(0));
}

const hmCanvas = document.getElementById('csi-heatmap');

function renderHeatmap() {
    const w = hmCanvas.clientWidth;
    const h = hmCanvas.clientHeight;
    hmCanvas.width = w;
    hmCanvas.height = h;
    const ctx = hmCanvas.getContext('2d');
    const cw = w / TIME_COLS;
    const ch = h / SUBS;

    for (let r = 0; r < SUBS; r++) {
        for (let c = 0; c < TIME_COLS; c++) {
            const v = heatmapGrid[r][c]; // expected 0–100
            const norm = Math.min(v / 80, 1);
            // dark blue → cyan → white
            const rr = Math.round(norm * norm * 255);
            const gg = Math.round(norm * 255);
            const bb = Math.round(128 + norm * 127);
            ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
            ctx.fillRect(c * cw, r * ch, cw + 1, ch + 1);
        }
    }
}

function pushHeatmapColumn(amplitudes) {
    for (let r = 0; r < SUBS; r++) {
        heatmapGrid[r].shift();
        heatmapGrid[r].push(amplitudes[r] || 0);
    }
    renderHeatmap();
}

// ────────────────────────────────────────────────────
// Client-side simulation
// ────────────────────────────────────────────────────
let clientSim = false;
const simCheck = document.getElementById('sim-check');
const simIndicator = document.getElementById('sim-indicator');

simCheck.addEventListener('change', (e) => {
    clientSim = e.target.checked;
    simIndicator.classList.toggle('active', clientSim);
});

function getSimulatedCSI() {
    const t = performance.now() / 1000;
    const amp = [], ph = [];
    for (let i = 0; i < 56; i++) {
        const base = 50 + 5 * Math.sin(2 * Math.PI * i / 56);
        const breath = 3 * Math.sin(2 * Math.PI * 0.25 * t + i * 0.1);
        const hr = 0.8 * Math.sin(2 * Math.PI * 1.2 * t + i * 0.05);
        const noise = (Math.random() - 0.5) * 3;
        amp.push(Math.abs(base + breath + hr + noise));
        ph.push(Math.random() * 2 * Math.PI - Math.PI);
    }
    return {
        subcarriers: 56,
        amplitude: amp,
        phase: ph,
        breathing_bpm: 15 + (Math.random() - 0.5) * 2,
        heart_rate_bpm: 0,
        motion_power: 5 + Math.random() * 2,
        timestamp: Date.now() / 1000
    };
}

// ────────────────────────────────────────────────────
// DOM refs
// ────────────────────────────────────────────────────
const connDot     = document.getElementById('conn-dot');
const ssidTop     = document.getElementById('ssid-top');
const ssidDisp    = document.getElementById('ssid-display');
const sigVal      = document.getElementById('sig-val');
const mainBar     = document.getElementById('main-bar');
const breathVal   = document.getElementById('breath-val');
const breathBar   = document.getElementById('breath-bar');
const hrVal       = document.getElementById('hr-val');
const hrBar       = document.getElementById('hr-bar');
const statusBadge = document.getElementById('status-badge');
const chartBox    = document.getElementById('chart-box');
const offBanner   = document.getElementById('offline-banner');
const sCurrent    = document.getElementById('s-current');
const sZscore     = document.getElementById('s-zscore');
const sMotpwr     = document.getElementById('s-motpwr');
const sBpm        = document.getElementById('s-bpm');
const logBox      = document.getElementById('log-box');
const hwMode      = document.getElementById('hw-mode');
const hwCard      = document.getElementById('hw-card');

const threshSlider = document.getElementById('thresh-slider');
const sensLabel    = document.getElementById('sens-label');
const ctrlThresh   = document.getElementById('ctrl-thresh');
const ctrlThreshVal = document.getElementById('ctrl-thresh-val');

// ────────────────────────────────────────────────────
// State
// ────────────────────────────────────────────────────
let fails = 0;
let bootTime = Date.now();
let isCalibrating = true;
let lastMotionTs = 0;
const rawHist = [];
const logEntries = [];
let csiAvailable = false;
let lastBreathLog = 0;

// ────────────────────────────────────────────────────
// Threshold sliders (sync both)
// ────────────────────────────────────────────────────
function syncThresh(v) {
    const f = parseFloat(v).toFixed(1);
    sensLabel.innerText = `SENSITIVITY: ${f}σ`;
    ctrlThreshVal.innerText = `${f}σ`;
}

threshSlider.addEventListener('input', e => {
    ctrlThresh.value = e.target.value;
    syncThresh(e.target.value);
});
ctrlThresh.addEventListener('input', e => {
    threshSlider.value = e.target.value;
    syncThresh(e.target.value);
});

[threshSlider, ctrlThresh].forEach(el => {
    el.addEventListener('change', e => {
        fetch(`http://localhost:5000/set_threshold/${e.target.value}`).catch(() => {});
    });
});

// ────────────────────────────────────────────────────
// Gauge helpers
// ────────────────────────────────────────────────────
function setMainGauge(pct) {
    sigVal.innerText = pct;
    const circ = 2 * Math.PI * 65; // 408.4
    mainBar.style.strokeDashoffset = circ - (pct / 100) * circ;
    if (pct > 70) mainBar.style.stroke = 'var(--green)';
    else if (pct >= 40) mainBar.style.stroke = 'var(--amber)';
    else mainBar.style.stroke = 'var(--alert)';
}

function setMiniGauge(bar, valEl, value, min, max, unit) {
    const circ = 2 * Math.PI * 35; // 220
    const clamped = Math.max(min, Math.min(value, max));
    const pct = (clamped - min) / (max - min);
    bar.style.strokeDashoffset = circ - pct * circ;
    valEl.innerText = value > 0 ? value.toFixed(0) : '--';
    valEl.classList.toggle('calibrating-spinner', value <= 0);
}

// ────────────────────────────────────────────────────
// Logging
// ────────────────────────────────────────────────────
function addLog(type, text) {
    const now = new Date();
    const ts = now.toLocaleTimeString('en-US', { hour12: false });
    const div = document.createElement('div');
    div.className = 'log-entry' + (type === 'motion' ? ' alert' : ' breath');
    div.innerText = `[${ts}] ${text}`;
    logBox.prepend(div);
    logEntries.push({ time: ts, text });
    if (logBox.children.length > 50) logBox.removeChild(logBox.lastChild);
}

document.getElementById('btn-clear').addEventListener('click', () => { logBox.innerHTML = ''; });
document.getElementById('btn-export').addEventListener('click', () => {
    if (!logEntries.length) return;
    let csv = 'Time,Event\n';
    logEntries.forEach(e => { csv += `${e.time},"${e.text}"\n`; });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'csi_log.csv';
    a.click();
});

// ────────────────────────────────────────────────────
// Main polling loop
// ────────────────────────────────────────────────────
async function poll() {
    // ── RSSI ──
    try {
        const res = await fetch('http://localhost:5000/rssi');
        const d = await res.json();
        fails = 0;
        offBanner.style.display = 'none';
        connDot.classList.remove('off');

        ssidTop.innerText = d.router;
        ssidDisp.innerText = d.router;
        setMainGauge(d.signal);

        // Calibrating first 15s
        if (isCalibrating && Date.now() - bootTime > 15000) isCalibrating = false;

        // Chart
        chartData.shift(); chartData.push(d.signal);
        rssiChart.update();

        rawHist.push(d.signal);
        if (rawHist.length > 10) rawHist.shift();
        const mean = rawHist.reduce((a, b) => a + b, 0) / rawHist.length;
        const std = Math.sqrt(rawHist.reduce((a, b) => a + (b - mean) ** 2, 0) / rawHist.length);
        adaptMean = mean;

        sCurrent.innerText = `${d.signal}%`;
        sZscore.innerText = (d.zscore > 0 ? '+' : '') + d.zscore.toFixed(2);

        // Motion
        if (d.motion) {
            statusBadge.innerText = '⚠ MOTION DETECTED';
            statusBadge.className = 'badge motion';
            if (d.timestamp !== lastMotionTs) {
                lastMotionTs = d.timestamp;
                playBeep();
                chartBox.classList.add('flash');
                setTimeout(() => chartBox.classList.remove('flash'), 1500);
                addLog('motion', `MOTION  Z:${(d.zscore > 0 ? '+' : '') + d.zscore.toFixed(2)}  Signal:${d.signal}%`);
            }
        } else if (!csiAvailable) {
            statusBadge.innerText = '● IDLE';
            statusBadge.className = 'badge';
        }
    } catch (err) {
        fails++;
        if (fails >= 3) {
            offBanner.style.display = 'block';
            connDot.classList.add('off');
        }
    }

    // ── CSI ──
    let csiData = null;
    if (clientSim) {
        csiData = getSimulatedCSI();
    } else {
        try {
            const res2 = await fetch('http://localhost:5000/csi');
            csiData = await res2.json();
        } catch (e) { /* CSI not available */ }
    }

    if (csiData && csiData.amplitude) {
        // Check if CSI has actual data
        const ampVar = csiData.amplitude.reduce((s, v) => s + Math.abs(v), 0);
        csiAvailable = ampVar > 10;

        if (csiAvailable || clientSim) {
            pushHeatmapColumn(csiData.amplitude);
            sMotpwr.innerText = (csiData.motion_power || 0).toFixed(2);

            const bpm = csiData.breathing_bpm || 0;
            setMiniGauge(breathBar, breathVal, bpm, 6, 30);
            sBpm.innerText = bpm > 0 ? bpm.toFixed(1) : '--';

            const hr = csiData.heart_rate_bpm || 0;
            setMiniGauge(hrBar, hrVal, hr, 40, 120);

            // Log breathing periodically (every 10s)
            if (bpm > 0 && Date.now() - lastBreathLog > 10000) {
                lastBreathLog = Date.now();
                addLog('breath', `BREATH ${bpm.toFixed(1)} BPM`);
            }

            // Update badge for vital signs
            if (statusBadge.className !== 'badge motion' && bpm > 0) {
                statusBadge.innerText = '🫁 VITAL SIGNS ACTIVE';
                statusBadge.className = 'badge vital';
            }

            // HW status
            hwMode.innerText = clientSim ? 'SIM Mode' : 'CSI Mode';
            hwCard.lastElementChild.innerText = clientSim ? 'Client Simulation' : 'ESP32 / Server';
            simIndicator.classList.add('active');
        }
    } else {
        // No CSI data → RSSI only
        hwMode.innerText = 'RSSI Mode';
        hwCard.lastElementChild.innerText = 'Laptop Wi-Fi';
        if (!clientSim) simIndicator.classList.remove('active');
        // Push zeros to heatmap to keep it alive
        pushHeatmapColumn(new Array(56).fill(0));
    }
}

setInterval(poll, 1000);

// Initial heatmap render
renderHeatmap();
</script>
